services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: recovery_companion
      POSTGRES_USER: rc_user
      POSTGRES_PASSWORD: ${RC_DB_PASSWORD:?Set a private URL-safe RC_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rc_user -d recovery_companion"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://rc_user:${RC_DB_PASSWORD:?Set a private URL-safe RC_DB_PASSWORD}@db:5432/recovery_companion
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
      ALLOWED_HOSTS: ${RC_API_HOSTS:-localhost,127.0.0.1,10.0.2.2}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
