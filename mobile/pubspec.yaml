name: recovery_companion
description: Post-hospital recovery monitoring app

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.2.1
  riverpod_annotation: ^4.0.2

  # Navigation
  go_router: ^17.1.0

  # Networking
  dio: ^5.7.0
  retrofit: ^4.1.0

  # Local storage
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  flutter_secure_storage: ^10.0.0

  # Notifications
  flutter_local_notifications: ^20.1.0
  firebase_core: ^4.4.0
  firebase_messaging: ^16.1.1

  # Camera + ML
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.15.1

  # Voice
  speech_to_text: ^7.3.0
  flutter_tts: ^4.0.2

  # UI helpers
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.1.2
  fl_chart: ^1.1.1

  # Utils
  intl: ^0.20.2
  uuid: ^4.4.2
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  logger: ^2.4.0

  # Audio
  just_audio: ^0.10.5
  record: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.12
  riverpod_generator: ^4.0.3
  retrofit_generator: ^10.2.1
  freezed: ^3.2.5
  json_serializable: ^6.8.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lottie/
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Light.ttf
          weight: 300
        - asset: assets/fonts/Fraunces-Regular.ttf
          weight: 400
        - asset: assets/fonts/Fraunces-SemiBold.ttf
          weight: 600
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-Light.ttf
          weight: 300
