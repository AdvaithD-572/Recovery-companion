name: recovery_companion
description: Post-hospital recovery monitoring app

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.2.1
  go_router: ^17.1.0
  http: ^1.2.0
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^10.0.0
  flutter_local_notifications: ^20.1.0
  timezone: ^0.10.1
  image_picker: ^1.1.2
  speech_to_text: ^7.3.0
  flutter_tts: ^4.0.2
  fl_chart: ^1.1.1
  uuid: ^4.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Light.ttf
          weight: 300
        - asset: assets/fonts/Fraunces-Regular.ttf
          weight: 400
        - asset: assets/fonts/Fraunces-SemiBold.ttf
          weight: 600
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-Light.ttf
          weight: 300
