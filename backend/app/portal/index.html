<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clinic desk · Recovery Companion</title><link rel="stylesheet" href="style.css"><script src="desk.js" defer></script></head><body>
<header><strong>Recovery Companion</strong><span>Clinic desk</span><button id="logout" hidden>Sign out</button></header><main>
<section id="signin"><h1>Welcome to the clinic desk.</h1><form id="login"><label>Staff email<input name="email" type="email" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button>Sign in</button></form><nav class="account-links"><a href="admin.html">Station administrator</a> · <a href="account.html">Patient account</a></nav></section>
<section id="workspace" hidden><h1 id="clinicName"></h1><div class="layout"><aside><h2>Patient directory</h2><input id="search" aria-label="Search patients" placeholder="Find by name or patient ID"><div id="patients"></div><details><summary>Invite a patient</summary><form id="invite"><label>Patient account email<input type="email" name="email" required></label><button>Create invitation</button></form><output id="code"></output></details></aside>
<article><div id="empty">Select a patient to prepare their follow-up report.</div><section id="selected" hidden><div id="report"></div><div class="actions"><button id="print">Print / save PDF</button><button id="attendance">Record arrival</button><button id="refresh">Refresh report</button></div><details id="archive"><summary>Previously prepared reports</summary><div id="saved"></div></details><div id="clinical"><details><summary>Complete checkup</summary><form id="visit"><label>Checkup notes<textarea name="text" required maxlength="4000"></textarea></label><button>Finalize checkup</button></form></details><details><summary>Amend a completed checkup</summary><form id="amend"><label>Checkup<select name="visit" required></select></label><label>Amendment<textarea name="text" required maxlength="4000"></textarea></label><button>Save linked amendment</button></form></details><details><summary>Add attention rule</summary><form id="rule"><label>Event<select name="event"><option value="skipped">Skipped medicine</option><option value="food">Food recorded</option></select></label><label>Exact medicine or food name<input name="match" required></label><label>Level<select name="severity"><option>Needs review</option><option>Critical</option></select></label><label>Clinical reason<input name="reason" required></label><button>Save rule</button></form></details></div></section></article></div></section><output id="message" role="status"></output></main></body></html>
